# Readiness logic scaled from 30d/172800 samples to 1m/4 samples.
# This tests coverage, boundary witness, and failed-observation gating without
# loading a full 30-day fixture into the promtool test query engine.
{
  "rule_files": [],
  "evaluation_interval": "15s",
  "tests": [
    {
      "name": "scaled-complete-history",
      "interval": "15s",
      "input_series": [
        {
          "series": "flask:slo_observation_valid",
          "values": "1+0x8"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "(min_over_time(flask:slo_observation_valid[1m]) == bool 1) * (count_over_time(flask:slo_observation_valid[1m]) >= bool 4) * (flask:slo_observation_valid == bool 1) * ((count(present_over_time(flask:slo_observation_valid[1m] offset 1m)) > bool 0) or vector(0))",
          "eval_time": "2m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        },
        {
          "expr": "(min_over_time(flask:slo_observation_valid[1m]) == bool 1) * (count_over_time(flask:slo_observation_valid[1m]) >= bool 4) * (flask:slo_observation_valid == bool 1) * ((count(present_over_time(flask:slo_observation_valid[1m] offset 1m)) > bool 0) or vector(0))",
          "eval_time": "45s",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        }
      ]
    },
    {
      "name": "scaled-failed-observation",
      "interval": "15s",
      "input_series": [
        {
          "series": "flask:slo_observation_valid",
          "values": "1+0x6 0 1"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "(min_over_time(flask:slo_observation_valid[1m]) == bool 1) * (count_over_time(flask:slo_observation_valid[1m]) >= bool 4) * (flask:slo_observation_valid == bool 1) * ((count(present_over_time(flask:slo_observation_valid[1m] offset 1m)) > bool 0) or vector(0))",
          "eval_time": "2m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        }
      ]
    }
  ]
}
